name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1
      
      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Create Mock google-services.json
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "mock-project" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789:android:123456789" },
              "oauth_client": [],
              "api_key": [{ "current_key": "mock_api_key" }]
            }]
          }
          EOF
      
      - name: Run Unit Tests
        run: ./gradlew test
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
